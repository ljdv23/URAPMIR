name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar Flutter
        run: flutter --version

      - name: Crear Android limpio
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name urapmir

      - name: Permitir Internet cámara y voz
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in INTERNET CAMERA RECORD_AUDIO; do
            if ! grep -q "android.permission.$PERM" "$MANIFEST"; then
              sed -i "/<manifest/a\\    <uses-permission android:name=\"android.permission.$PERM\" />" "$MANIFEST"
            fi
          done

      - name: Configurar Android minimo 24
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: |
          rm -rf .dart_tool
          flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: URAPMIR-v2.1-FINAL-COMPLETA
          path: build/app/outputs/flutter-apk/app-release.apk
