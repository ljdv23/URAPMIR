name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar Flutter
        run: flutter --version

      - name: Crear estructura Android si falta
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name urapmir
          fi

      - name: Permitir Internet para imágenes clínicas
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          echo "AndroidManifest final:"
          cat "$MANIFEST"

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: |
          rm -rf .dart_tool
          flutter pub get
          flutter pub deps | grep -E "sqflite|path" || true

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: URAPMIR-v1.8-IMAGENES-REALES
          path: build/app/outputs/flutter-apk/app-release.apk
