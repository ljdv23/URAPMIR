name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          java -version

      - name: Crear plataforma Android reproducible
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name urapmir

          # Flutter crea automáticamente un test para una clase MyApp.
          # URAPMIR utiliza UrapMirApp, por lo que eliminamos ese test
          # genérico que no pertenece a nuestro proyecto.
          rm -f test/widget_test.dart

      - name: Configurar Android para URAPMIR
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
          ]

          for perm in permissions:
              line = f'    <uses-permission android:name="{perm}" />'
              if perm not in text:
                  pos = text.find(">")
                  text = text[:pos+1] + "\n" + line + text[pos+1:]

          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")

          if not gradle.exists():
              raise SystemExit("No existe android/app/build.gradle.kts")

          g = gradle.read_text()

          g = g.replace(
              "minSdk = flutter.minSdkVersion",
              "minSdk = 24"
          )

          mlkit = '''
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          '''

          if 'com.google.mlkit:text-recognition-chinese:16.0.1' not in g:
              g = g.rstrip() + "\n\n" + mlkit.strip() + "\n"

          gradle.write_text(g)
          PY

      - name: Limpiar dependencias Flutter
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter pub get

      - name: Analizar codigo principal
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: URAPMIR-v2.1-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
