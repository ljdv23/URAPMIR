name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Comprobar Flutter
        run: flutter --version

      - name: Limpiar proyecto
        run: flutter clean

      - name: Instalar dependencias
        run: |
          rm -rf .dart_tool
          rm -f pubspec.lock
          flutter pub get
          flutter pub deps | grep -E "sqflite|path" || true

      - name: Compilar APK
        run: flutter build apk --release

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: URAPMIR-v1.8-APK
          path: build/app/outputs/flutter-apk/app-release.apk
